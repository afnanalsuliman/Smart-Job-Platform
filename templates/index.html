<!DOCTYPE html>
<html>
<head>
    <title>Smart Job Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- 🔥 Header -->
    <header>
        <h1>💼 Smart Job Platform</h1>
    </header>

    <!-- 🔥 Container -->
    <div class="container">

        <p>This is your first job platform 🚀</p>

        <h2>📈 Salary Chart:</h2>
        <img src="/static/chart.png" width="600">

        <h2>💼 Job Listings:</h2>
        <ul>
            {% for job in jobs %}
                <li>

                    <!-- 🔥 معلومات الوظيفة -->
                    <div class="job-info">
                        {{ job[1] }} - {{ job[2] }} - 💰 {{ job[3] }} - {{ job[4] }}
                    </div>

                    <!-- 🔥 الأزرار -->
                    <div class="actions">
                        <form action="/edit/{{ job[0] }}" method="GET">
                            <button type="submit" class="edit-btn">✏️ Edit</button>
                        </form>

                        <form action="/delete/{{ job[0] }}" method="POST">
                            <button type="submit" class="delete-btn">❌ Delete</button>
                        </form>
                    </div>

                </li>
            {% endfor %}
        </ul>

        <h2>➕ Add Job:</h2>

        <!-- 🔥 فورم الإضافة -->
        <form action="/add" method="POST" class="add-form">
            <input type="text" name="title" placeholder="Job Title" required>
            <input type="text" name="company" placeholder="Company Name" required>
            <input type="number" name="salary" placeholder="Salary" required>

            <select name="experience" required>
                <option value="">Select Experience</option>
                <option value="Junior">Junior</option>
                <option value="Mid">Mid</option>
                <option value="Senior">Senior</option>
            </select>

            <br><br>

            <button type="submit" class="add-btn">➕ Add Job</button>
        </form>

    </div>

</body>
</html>
